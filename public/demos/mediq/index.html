<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MediQ · Interactive product tour</title>
<meta name="description" content="Clinic queues without the crowded waiting room. Click through how MediQ works for clinics, reception, patients and doctors.">
<meta property="og:title" content="MediQ · Interactive product tour">
<meta property="og:description" content="Clinic queues without the crowded waiting room. Coming soon.">
<meta property="og:image" content="og-image.png">
<link rel="stylesheet" href="frames.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: Inter, system-ui, sans-serif; color: #E6F2F3; overflow: hidden;
    background: radial-gradient(1200px 700px at 15% 10%, #0E5A62 0%, transparent 60%),
                radial-gradient(900px 600px at 95% 100%, #0A4A57 0%, transparent 55%), var(--deep);
  }
  button { font: inherit; cursor: pointer; }
  .app { display: grid; grid-template-rows: auto 1fr auto; height: 100%; }

  header { display: flex; align-items: center; gap: 14px; padding: 14px 24px; }
  header .name { font-weight: 800; font-size: 20px; letter-spacing: -.02em; }
  header .logo { font-size: 34px; }
  .chip { padding: 5px 11px; border-radius: 99px; font-size: 12px; font-weight: 700; letter-spacing: .02em;
          background: rgba(20, 184, 166, .16); color: #5EEAD4; border: 1px solid rgba(94, 234, 212, .35); }
  header .spacer { flex: 1; }
  .ghost { background: rgba(255, 255, 255, .08); color: #E6F2F3; border: 1px solid rgba(255, 255, 255, .16);
           border-radius: 10px; padding: 8px 14px; font-weight: 600; font-size: 14px; }
  .ghost:hover { background: rgba(255, 255, 255, .14); }

  main { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 28px; padding: 6px 24px 10px; min-height: 0; }
  .stage { position: relative; display: grid; place-items: center; min-height: 0; }
  .device { position: absolute; inset: 0; display: grid; place-items: center; transition: opacity .35s ease, transform .35s ease; }
  .device.out { opacity: 0; transform: translateY(14px) scale(.985); pointer-events: none; }

  .panel { display: flex; flex-direction: column; min-height: 0; gap: 16px; }
  .card { background: rgba(255, 255, 255, .06); border: 1px solid rgba(255, 255, 255, .1); border-radius: 18px; padding: 20px; }
  .count { font-size: 12px; font-weight: 700; color: #5EEAD4; letter-spacing: .08em; text-transform: uppercase; }
  .card h2 { margin: 8px 0 8px; font-size: 24px; line-height: 1.2; letter-spacing: -.02em; color: #fff; }
  .card p { margin: 0; color: #B9D3D6; line-height: 1.55; font-size: 15px; }
  .hint { margin-top: 14px; font-size: 13px; color: #8FB3B7; }
  .hint b { color: #FDBA74; }
  .nav { display: flex; gap: 10px; margin-top: 18px; }
  .nav button { flex: 1; border: 0; border-radius: 12px; padding: 12px; font-weight: 700; }
  .prev { background: rgba(255, 255, 255, .1); color: #fff; }
  .next { background: linear-gradient(135deg, var(--primary), var(--primary-2)); color: #fff; }
  .next:hover { filter: brightness(1.1); }
  .auto { display: flex; align-items: center; gap: 8px; margin-top: 12px; font-size: 13px; color: #B9D3D6; background: none; border: 0; padding: 0; }
  .auto .sw { width: 34px; height: 20px; border-radius: 99px; background: rgba(255, 255, 255, .18); position: relative; transition: background .2s; }
  .auto .sw::after { content: ''; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: transform .2s; }
  .auto[aria-pressed=true] .sw { background: var(--mint); }
  .auto[aria-pressed=true] .sw::after { transform: translateX(14px); }

  .chapters { overflow-y: auto; padding: 8px; }
  .chapters button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 12px; border: 0; border-radius: 12px;
                     background: none; color: #B9D3D6; text-align: left; font-size: 14px; font-weight: 600; }
  .chapters button:hover { background: rgba(255, 255, 255, .06); }
  .chapters button.on { background: rgba(20, 184, 166, .16); color: #fff; }
  .chapters .n { margin-left: auto; font-size: 12px; color: #7FA6AA; font-weight: 500; }
  .chapters .ic { width: 24px; text-align: center; }

  footer { display: flex; align-items: center; gap: 16px; padding: 10px 24px 16px; font-size: 12px; color: #7FA6AA; }
  .bar { flex: 1; height: 4px; border-radius: 99px; background: rgba(255, 255, 255, .1); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--mint), #5EEAD4); transition: width .4s; }

  /* Start and end screens */
  .overlay { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 24px; overflow: auto;
             background: radial-gradient(1000px 600px at 20% 0%, #0E6B74 0%, transparent 60%), var(--deep); transition: opacity .4s; }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .hero { display: grid; grid-template-columns: 1.05fr .95fr; gap: 48px; align-items: center; max-width: 1180px; width: 100%; }
  .hero .logo { font-size: 64px; }
  .hero h1 { font-size: clamp(34px, 4.6vw, 58px); line-height: 1.05; letter-spacing: -.035em; margin: 22px 0 16px; color: #fff; }
  .hero h1 span { background: linear-gradient(90deg, #5EEAD4, #22D3EE); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .hero p { font-size: 18px; line-height: 1.6; color: #B9D3D6; margin: 0 0 28px; max-width: 34em; }
  .cta { display: flex; flex-wrap: wrap; gap: 12px; }
  .cta .big { border: 0; border-radius: 14px; padding: 16px 24px; font-weight: 700; font-size: 16px; color: #fff;
              background: linear-gradient(135deg, var(--primary), var(--primary-2)); box-shadow: 0 10px 30px rgba(8, 145, 178, .35); }
  .cta .ghost { padding: 16px 22px; border-radius: 14px; font-size: 16px; }
  .soon { display: inline-flex; align-items: center; gap: 10px; margin-top: 28px; font-size: 14px; color: #B9D3D6; }
  .soon .dot { width: 9px; height: 9px; border-radius: 50%; background: #FBBF24; box-shadow: 0 0 0 6px rgba(251, 191, 36, .16); }
  .credit { margin-top: 10px; font-size: 13px; color: #7FA6AA; }
  .collage { position: relative; height: min(560px, 70vh); }
  .collage .frame-browser { position: absolute; left: 0; top: 8%; width: 88%; transform: rotate(-2deg); }
  .collage .frame-phone { position: absolute; right: 0; bottom: 0; height: 78%; transform: rotate(3deg); }
  .collage .screen img { pointer-events: none; }

  .modal { position: fixed; inset: 0; z-index: 30; display: none; place-items: center; padding: 24px; background: rgba(0, 0, 0, .75); }
  .modal.open { display: grid; }
  .modal video { max-width: min(1100px, 100%); max-height: 86vh; border-radius: 14px; background: #000; box-shadow: 0 30px 80px rgba(0, 0, 0, .5); }
  .modal .x { position: absolute; top: 18px; right: 22px; }

  @media (max-width: 960px) {
    body { overflow: auto; }
    .app { height: auto; min-height: 100%; }
    main { grid-template-columns: 1fr; }
    .stage { height: 62vh; }
    .chapters { display: none; }
    .hero { grid-template-columns: 1fr; }
    .collage { height: 360px; }
    header .ghost.keys { display: none; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <span class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19V6l7 8 7-8v13"/></svg></span>
    <span class="name">MediQ</span>
    <span class="chip" id="status"></span>
    <span class="spacer"></span>
    <button class="ghost" id="open-video" hidden>▶ Watch the video</button>
    <button class="ghost" id="home">Overview</button>
  </header>
  <main>
    <div class="stage" id="stage"></div>
    <aside class="panel">
      <div class="card">
        <div class="count" id="count"></div>
        <h2 id="title"></h2>
        <p id="body"></p>
        <div class="hint" id="hint"></div>
        <div class="nav">
          <button class="prev" id="prev">← Back</button>
          <button class="next" id="next">Next →</button>
        </div>
        <button class="auto" id="auto" aria-pressed="false"><span class="sw"></span> Autoplay</button>
      </div>
      <div class="card chapters" id="chapters"></div>
    </aside>
  </main>
  <footer>
    <span id="credit"></span>
    <div class="bar"><i id="progress"></i></div>
    <span>← → keys · space for autoplay</span>
  </footer>
</div>

<div class="overlay" id="start">
  <div class="hero">
    <div>
      <span class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19V6l7 8 7-8v13"/></svg></span>
      <h1>Clinic queues <span>without the crowded waiting room</span></h1>
      <p id="pitch"></p>
      <div class="cta">
        <button class="big" id="begin">Start the interactive tour →</button>
        <button class="ghost" id="hero-video" hidden>▶ Watch the 1-minute video</button>
      </div>
      <div class="soon"><span class="dot"></span><span id="status-line"></span></div>
      <div class="credit" id="credit-2"></div>
    </div>
    <div class="collage">
      <div class="frame-browser"><div class="bar"><i></i><i></i><i></i><div class="addr">MediQ · <b>Reception</b></div></div>
        <div class="screen"><img src="img/web-22-reception-busy.jpg" alt="MediQ reception desk with two doctors' live queues"></div></div>
      <div class="frame-phone"><div class="screen"><img src="img/web-17-patient-in-line.jpg" alt="Patient's live token page"></div></div>
    </div>
  </div>
</div>

<div class="overlay hidden" id="end">
  <div style="text-align:center; max-width: 640px">
    <span class="logo" style="font-size:72px"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19V6l7 8 7-8v13"/></svg></span>
    <h1 style="font-size:44px; letter-spacing:-.03em; margin:22px 0 10px; color:#fff">That’s MediQ.</h1>
    <p style="font-size:18px; color:#B9D3D6; line-height:1.6; margin:0 0 26px">From the QR poster at the door to the doctor’s prescription, one live queue for the whole clinic.</p>
    <div class="soon" style="margin:0 0 28px; font-size:16px"><span class="dot"></span><b id="status-end" style="color:#fff"></b></div>
    <div class="cta" style="justify-content:center">
      <button class="big" id="again">↺ Take the tour again</button>
      <button class="ghost" id="end-video" hidden>▶ Watch the video</button>
    </div>
    <div class="credit" id="credit-3" style="margin-top:26px"></div>
  </div>
</div>

<div class="modal" id="modal">
  <button class="ghost x" id="close-video">✕ Close</button>
  <video id="video" controls playsinline preload="none" poster="img/web-19-tv-display.jpg"></video>
</div>

<script src="steps.js"></script>
<script>
const { brand, chapters, steps } = window.MEDIQ;
const VIDEO = 'media/mediq-demo-16x9.mp4';
const AUTOPLAY_MS = 5500;
const $ = id => document.getElementById(id);
let i = 0, timer = null;

$('status').textContent = brand.status;
$('status-line').textContent = brand.statusLine;
$('status-end').textContent = brand.statusLine;
$('pitch').textContent = brand.pitch;
for (const id of ['credit', 'credit-2', 'credit-3']) $(id).textContent = brand.credit;

// The video button only shows if the video file is there.
const probe = document.createElement('video');
probe.preload = 'metadata';
probe.onloadedmetadata = () => { for (const id of ['open-video', 'hero-video', 'end-video']) $(id).hidden = false; };
probe.src = VIDEO;

const counts = {};
steps.forEach(s => counts[s.ch] = (counts[s.ch] || 0) + 1);
$('chapters').innerHTML = chapters.map(c =>
  `<button data-ch="${c.id}"><span class="ic">${c.icon}</span>${c.title}<span class="n">${counts[c.id] || 0}</span></button>`).join('');
$('chapters').onclick = e => {
  const b = e.target.closest('button');
  if (b) go(steps.findIndex(s => s.ch === b.dataset.ch), true);
};

function frameHTML(s) {
  const img = `<div class="page"><img src="img/${s.img}.jpg" alt="${s.title}">${s.hot ? `<span class="hot" title="Click to continue" style="left:${s.hot.x}%;top:${s.hot.y}%"></span>` : ''}</div>`;
  const status = s.frame === 'phone' && s.img.startsWith('web-') ? '<div class="status"><span>9:41</span><span>▂▄▆ ▮</span></div>' : '';
  const screen = `<div class="screen">${status}<div class="scroller">${img}</div></div>`;
  if (s.frame === 'phone') return `<div class="frame-phone">${screen}</div>`;
  if (s.frame === 'tv') return `<div class="frame-tv"><div class="bezel">${screen}</div><div class="stand"></div></div>`;
  return `<div class="frame-browser"><div class="bar"><i></i><i></i><i></i><div class="addr">MediQ · <b>${s.url || ''}</b></div></div>${screen}</div>`;
}

function fit(device, s) {
  // Size the frame to the stage: phones by height, browser/TV by width.
  const st = $('stage').getBoundingClientRect();
  const el = device.firstElementChild;
  if (s.frame === 'phone') {
    const h = Math.min(st.height, (st.width) * 19.5 / 9);
    el.style.height = h + 'px';
  } else {
    const ratio = s.frame === 'tv' ? 16 / 9 : 16 / 10;
    const chrome = s.frame === 'tv' ? 42 : 38;
    el.style.width = Math.min(st.width, (st.height - chrome) * ratio) + 'px';
  }
}

function render() {
  const s = steps[i];
  const ch = chapters.find(c => c.id === s.ch);
  const old = [...$('stage').querySelectorAll('.device')];
  const device = document.createElement('div');
  device.className = 'device out';
  device.innerHTML = frameHTML(s);
  $('stage').appendChild(device);
  fit(device, s);
  for (const o of old) { o.classList.add('out'); setTimeout(() => o.remove(), 350); }
  requestAnimationFrame(() => requestAnimationFrame(() => device.classList.remove('out')));

  const img = device.querySelector('img');
  const scrollToHot = () => {
    if (!s.hot) return;
    const sc = device.querySelector('.scroller');
    const y = img.offsetHeight * s.hot.y / 100 - sc.clientHeight / 2;
    if (y > 0) sc.scrollTo({ top: y, behavior: 'smooth' });
  };
  img.complete ? setTimeout(scrollToHot, 300) : img.addEventListener('load', () => setTimeout(scrollToHot, 300));
  const hot = device.querySelector('.hot');
  if (hot) hot.onclick = () => go(i + 1, true);

  $('count').textContent = `${ch.icon} ${ch.title} · ${i + 1} / ${steps.length}`;
  $('title').textContent = s.title;
  $('body').textContent = s.body;
  $('hint').innerHTML = s.hot ? 'Click the <b>pulsing button</b> on the screen, or press →' : (s.tall ? 'Scroll the screen to see the whole page.' : '');
  $('prev').disabled = i === 0;
  $('progress').style.width = ((i + 1) / steps.length * 100) + '%';
  for (const b of $('chapters').children) b.classList.toggle('on', b.dataset.ch === s.ch);
  if (steps[i + 1]) new Image().src = `img/${steps[i + 1].img}.jpg`;
}

function go(n, byUser) {
  if (byUser) setAuto(false);
  if (n >= steps.length) { $('end').classList.remove('hidden'); setAuto(false); return; }
  i = Math.max(0, n);
  render();
}

function setAuto(on) {
  clearInterval(timer);
  timer = on ? setInterval(() => go(i + 1), AUTOPLAY_MS) : null;
  $('auto').setAttribute('aria-pressed', on);
}

$('next').onclick = () => go(i + 1, true);
$('prev').onclick = () => go(i - 1, true);
$('auto').onclick = () => setAuto(!timer);
$('begin').onclick = () => { $('start').classList.add('hidden'); go(0); };
$('home').onclick = () => { setAuto(false); $('start').classList.remove('hidden'); };
$('again').onclick = () => { $('end').classList.add('hidden'); go(0); };

function openVideo() {
  setAuto(false);
  $('video').src = VIDEO;
  $('modal').classList.add('open');
  $('video').play().catch(() => {});
}
function closeVideo() { $('video').pause(); $('modal').classList.remove('open'); }
for (const id of ['open-video', 'hero-video', 'end-video']) $(id).onclick = openVideo;
$('close-video').onclick = closeVideo;
$('modal').onclick = e => { if (e.target === $('modal')) closeVideo(); };

addEventListener('keydown', e => {
  if ($('modal').classList.contains('open')) { if (e.key === 'Escape') closeVideo(); return; }
  if (!$('start').classList.contains('hidden') || !$('end').classList.contains('hidden')) return;
  if (e.key === 'ArrowRight') go(i + 1, true);
  else if (e.key === 'ArrowLeft') go(i - 1, true);
  else if (e.key === ' ') { e.preventDefault(); setAuto(!timer); }
});
addEventListener('resize', () => { const d = $('stage').querySelector('.device:last-child'); if (d) fit(d, steps[i]); });
render();
</script>
</body>
</html>
